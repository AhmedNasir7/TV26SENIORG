services:
  # PostgreSQL Database (Development)
  postgres:
    image: postgres:16-alpine
    container_name: secureexam-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-secureexam}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - secureexam-network

  # Next.js Development Server
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: secureexam-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      # Demo fill buttons on the sign-in page: local testing only (passwords as in CREDENTIALS.md)
      - SHOW_DEMO_LOGINS=true
      - DEMO_ADMIN_PASSWORD=Demo-chqRodTGUQGO
      - DEMO_EXAMINER_PASSWORD=Demo-4JHnGboxMAq-
      - DEMO_CANDIDATE_PASSWORD=Demo-mrEY8GNJI506
      # Local testing always uses the Postgres container below, never the
      # DATABASE_URL in .env (which points at the shared/remote database).
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-secureexam}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - secureexam-network
    # Start from a clean build cache: a reused one makes nested API routes answer 404 after a restart
    command: sh -c "rm -rf /app/.next/* && exec pnpm dev"

volumes:
  postgres_data_dev:
    driver: local

networks:
  secureexam-network:
    driver: bridge
